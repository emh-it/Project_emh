<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PCI DSS Report on Compliance</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    />
    <style>
      html,
      body {
        height: 100vh;
        margin: 0;
        padding: 0;
        background: #f4f4f4;
        overflow: hidden;
      }

      .header-bar {
        background: #03806f;
        color: #ffffff;
        text-align: center;
        font-weight: bold;
        font-size: 1.3rem;
        padding: 8px 0;
        margin-bottom: 0;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .main-table,
      .main-table th,
      .main-table td {
        border: 1px solid #888;
        border-collapse: collapse;
      }

      .main-table th,
      .main-table td {
        padding: 4px 8px;
        background: #eaf3fa;
      }

      .main-table th {
        background: #dbeaf7;
        font-weight: bold;
      }

      .section-table,
      .section-table th,
      .section-table td {
        border: 1px solid #888;
        border-collapse: collapse;
      }

      .section-table th,
      .section-table td {
        padding: 2px 6px;
        background: #fff;
        vertical-align: top;
      }

      .section-table th {
        background: #f2f2f2;
        font-weight: normal;
        width: 160px;
        white-space: nowrap;
      }

      .desc-cell {
        height: 60px;
      }

      .req-header {
        background: #dbeaf7;
        text-align: center;
        font-weight: bold;
      }

      .scope-col {
        min-width: 60px;
      }

      .yn-col {
        min-width: 40px;
      }

      /* sidebar click styling */
      .req-row {
        cursor: pointer;
      }

      .req-row:hover {
        background: #f6f6f6;
      }

      .req-row.active {
        background: #eef5ff;
        font-weight: 600;
      }

      .req-row.child-req td:nth-child(2) {
        color: #333;
      }

      .req-row.child-req td:first-child {
        padding-left: 18px;
      }

      /* Split scrollable grids layout */
      .split-container {
        display: flex;
        height: calc(100vh - 40px);
        overflow: hidden;
        margin: 0;
        width: 100%;
      }

      .left-grid {
        width: 320px;
        min-width: 180px;
        max-width: 400px;
        background: #fff;
        border-right: 1px solid #ddd;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
        flex-shrink: 0;
      }

      .right-grid {
        flex: 1;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 24px 24px 24px 24px;
        background: #f4f4f4;
        scroll-behavior: smooth;
        margin: 0;
      }

      @media (max-width: 900px) {
        .left-grid {
          width: 120px;
          min-width: 80px;
        }
        .right-grid {
          padding: 8px 2px;
        }
      }
    </style>
  </head>

  <body>
    <div class="header-bar">PCI DSS Report on Compliance</div>
    <div class="split-container">
      <!-- LEFT GRID (Sidebar) -->
      <div class="left-grid">
        <table style="width: 100%; border: none">
          <tr>
            <th class="req-header" colspan="2">PCI Requirements</th>
          </tr>
          {% for kind, r in sidebar_items %}
          <tr
            class="req-row {% if selected and r.requirement_id == selected.requirement_id %}active{% endif %} {% if kind == 'child' %}child-req{% endif %}"
            data-rid="{{ r.requirement_id }}"
            onclick="loadPanel('{{ r.requirement_id }}')"
          >
            <td style="width: 70px">{{ r.requirement_id }}</td>
            <td>
              {% with text=r.requirement_text|default_if_none:"" %}
                {% if text %}
                  {{ text|truncatewords:6 }}
                {% else %}
                  &mdash;
                {% endif %}
              {% endwith %}
            </td>
          </tr>
          {% endfor %}
        </table>
      </div>
      <div style="margin: 20px 0; padding: 12px; background: #f4f8fa; border-radius: 6px;">
        <b>Select Client:</b>
        <select id="client_select">
          {% for client in clients %}
          <option value="{{ client.client_id }}" {% if client.client_id == selected_client_id %}selected{% endif %}>
            {{ client.client_id }} - {{ client.client_name }}
          </option>
          {% endfor %}
        </select>
      </div>
      <!-- RIGHT GRID (Main Content) -->
      <div class="right-grid" id="right-panel">
        {% include "app/panel.html" %}
      </div>
    </div>

   

    <script>
      async function loadPanel(rid) {
        const clientId = document.getElementById('client_select').value;
        const res = await fetch(`/panel/${rid}/?client_id=${clientId}`);
        const data = await res.json();

        document.getElementById("right-panel").innerHTML = data.html;

        // Scroll to top of the right grid after DOM update
        setTimeout(() => {
          const rightGrid = document.querySelector(".right-grid");
          if (rightGrid) {
            rightGrid.scrollTo({ top: 0, left: 0, behavior: "smooth" });
          }
        }, 0);

        // sidebar active highlight
        document
          .querySelectorAll(".req-row")
          .forEach((el) => el.classList.remove("active"));
        const active = document.querySelector(`.req-row[data-rid="${rid}"]`);
        if (active) active.classList.add("active");

        // Re-initialize Materialize selects after AJAX content load
        var elems = document.querySelectorAll("#right-panel select");
        M.FormSelect.init(elems);
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var elems = document.querySelectorAll("select");
        M.FormSelect.init(elems);
      });
    </script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
    var clientSelect = document.getElementById('client_select');
    if (clientSelect) {
        clientSelect.addEventListener('change', function() {
            var url = new URL(window.location.href);
            url.searchParams.set('client_id', this.value);
            window.location.href = url.toString();
        });
    }
});
    </script>
  </body>
</html>
