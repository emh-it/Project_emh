<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCI DSS Compliance Manage</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'app/styles.css' %}">
    <!-- <link rel="stylesheet" href="./styles.css"> -->
</head>
<body>
    <div class="container">
        <!-- Left Sidebar - Requirements List -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>PCI DSS v4.0</h1>
                <p>Compliance Requirements</p>
            </div>
            <div class="requirements-list" id="requirementsList">
                <!-- Requirements will be rendered here from backend -->
                <!-- Each requirement should have:
                     - requirement ID
                     - requirement number
                     - requirement title
                     - sub-requirements count
                -->
            </div>
        </aside>

        <!-- Main Content Area -->
        
            <!-- Middle Section - Sub-requirements Details -->
            <section class="details-section">
                <div id="detailsContent"> 
                    <!-- Welcome state - shown when no requirement is selected -->
                    <div class="empty-state" id="emptyState">
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        <p>Select a requirement to view details</p>
                    </div> 

                    <!-- This section will be populated when a requirement is selected -->
                     <div class="requirement-details" id="requirementDetails" style="display: none;">
                        <div class="details-header">
                            <h2 id="requirementTitle"></h2>
                            <p id="requirementDescription"></p>
                        </div>
                        <div id="subRequirementsList" class="sub-requirements-list">
                            <!-- Sub-requirements will be rendered here -->
                            <!-- Each sub-requirement should have:
                                 - sub-requirement ID
                                 - title
                                 - description
                                 - testing procedure
                                 - evidence count (from backend)
                            -->
                         </div>
                    </div>
                </div>
            </section> 
            <!-- Right Section - Evidence Upload -->
            <aside class="upload-section">
                <div class="upload-header">
                    <h3>Evidence Upload</h3>
                    <p>Upload compliance documentation</p>
                </div>

                <div id="uploadContent">
                    <!-- Empty state - shown when no sub-requirement is selected -->
                    <div class="upload-empty-state" id="uploadEmptyState">
                        <!-- <svg class="upload-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> -->
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <p>Select a sub-requirement to upload evidence</p>
                    </div>

                    <!-- Upload form - shown when sub-requirement is selected -->
                    <div class="upload-form" id="uploadForm" style="display: none;">
                        <div class="selected-requirement-info" id="selectedSubReqInfo">
                            <p class="info-label">Selected Requirement</p>
                            <p class="info-text" id="selectedSubReqTitle"></p>
                        </div>

                        <div class="form-group">
                            <label for="evidenceLabel">Evidence Label</label>
                            <input 
                                type="text" 
                                id="evidenceLabel" 
                                placeholder="Enter a descriptive label..."
                                class="form-input"
                            >
                        </div>

                        <div class="upload-area" id="uploadArea">
                            <input 
                                type="file" 
                                id="fileInput" 
                                class="file-input"
                                accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg"
                            >
                            <label for="fileInput" class="upload-label">
                                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="17 8 12 3 7 8"></polyline>
                                    <line x1="12" y1="3" x2="12" y2="15"></line>
                                </svg>
                                <p class="upload-text">Click to upload evidence</p>
                                <p class="upload-hint">PDF, DOC, XLS, or image files</p>
                            </label>
                        </div>

                        <div class="evidence-list-section">
                            <h4>Uploaded Evidence</h4>
                            <div id="evidenceList" class="evidence-list">
                                <!-- Evidence items will be rendered here from backend -->
                                <!-- Each evidence item should have:
                                     - evidence ID
                                     - file name
                                     - label
                                     - upload date/time
                                     - file size
                                -->
                            </div>
                        </div>

                        <div class="upload-actions" style="margin-top:16px;">
                            <button id="uploadButton" class="btn upload-btn">Upload</button>
                        </div>

                        <div class="comments-section" style="margin-top:18px;">
                            <h4>QSA Comments</h4>
                            <textarea id="qsaComments" name="qsaComments" placeholder="Enter QSA comments..." style="width:100%; min-height:140px; padding:8px; box-sizing:border-box;"></textarea>
                        </div>

                        <div class="placeholder-section" style="margin-top:18px;">
                            <h4>Additional Notes</h4>
                            <textarea id="additionalNotes" name="additionalNotes" placeholder="Placeholder..." style="width:100%; min-height:140px; padding:8px; box-sizing:border-box;"></textarea>
                        </div>

                        <div class="update-actions" style="margin-top:16px;">
                            <button id="updateButton" class="btn update-btn">Update</button>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

     <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="{% static 'app/app.js' %}"></script>
</body>
</html>
